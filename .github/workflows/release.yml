name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # The CI result of the tagged commit
  checks: read
  # Build provenance of the release archives
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag is released only from a commit that passed CI. The latest run counts, so a
      # re-run after a flaky failure is enough (latest by id: a queued run has no
      # started_at yet). The tag usually follows the merge right away, while CI on main
      # still runs, so this waits for it
      - name: Wait for CI of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=CI%20passed&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | if length == 0 then "missing" else (sort_by(.id) | last | if .status != "completed" then "pending" elif .conclusion == "success" then "success" else "failure" end) end') ||
              conclusion="unavailable (API error)"
            case "$conclusion" in
              success) echo "CI passed for ${GITHUB_SHA}"; exit 0 ;;
              failure) echo "CI failed for ${GITHUB_SHA}"; exit 1 ;;
            esac
            echo "CI for ${GITHUB_SHA}: ${conclusion}, waiting (${attempt}/60)"
            sleep 30
          done
          echo "No CI result for ${GITHUB_SHA} after 30 minutes"; exit 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The Terraform Registry verifies the SHA256SUMS signature with the public key
      # added to the namespace; the private key and its passphrase are repository secrets
      - name: Import the signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # An exact version: in the release it runs next to the signing key. Dependabot
          # does not update this line; raise it by hand with the action
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
